name: 檢查台電電價是否調整

on:
  schedule:
    - cron: '0 1 * * 1' # 每週一 09:00（台北時間）
  workflow_dispatch: # 也可到 Actions 頁面手動執行

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 比對台電電價表與 rates.js
        id: check
        run: node scripts/check-taipower-rates.mjs

      - name: 有異動就開 issue 通知
        if: steps.check.outputs.status != 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.check.outputs.status }}';
            const report = fs.readFileSync('rate-check-report.md', 'utf8');
            const title = status === 'changed'
              ? '台電電價已調整，請更新 rates.js'
              : '台電電價檢查失敗，需人工確認';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'taipower-rates',
            });
            if (existing.data.some((i) => i.title === title)) {
              core.info('已有相同的 open issue，不重複開單。');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['taipower-rates'],
              assignees: [context.repo.owner],
              body: `${report}\n\n---\n由 [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 自動產生。`,
            });
